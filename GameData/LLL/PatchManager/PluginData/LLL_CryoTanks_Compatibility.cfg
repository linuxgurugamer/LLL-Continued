// LLL_CryoTanks_Compatibility.cfg
//
// ----------------------------------------------------------------------------
// LackLusterLabsContinued CryoTanks Compatibility Patch
//
// Purpose:
//   Some LackLusterLabsContinued tanks use InterstellarFuelSwitch (IFS) to
//   define their tank contents. CryoTanks expects actual RESOURCE nodes to
//   exist on the part before its conversion patches execute.
//
// What this patch does:
//   1. Runs BEFORE CryoTanks.
//   2. Finds all parts with an InterstellarFuelSwitch module whose first tank
//      setup is LiquidFuel + Oxidizer.
//   3. Reads the first pair of values from the IFS
//      "initialResourceAmounts" field.
//   4. Stores those values in temporary fields.
//   5. Removes the InterstellarFuelSwitch module.
//   6. Creates stock LiquidFuel and Oxidizer RESOURCE nodes using the
//      extracted amounts.
//   7. Leaves the temporary fields in place for later cleanup.
//
// Example:
//   resourceNames         = LiquidFuel,Oxidizer;LiquidFuel;...
//   initialResourceAmounts= 893,1091;1984;...
//
// Produces:
//
//   RESOURCE
//   {
//       name = LiquidFuel
//       amount = 893
//       maxAmount = 893
//   }
//
//   RESOURCE
//   {
//       name = Oxidizer
//       amount = 1091
//       maxAmount = 1091
//   }
//
// ----------------------------------------------------------------------------

@PART[*]:HAS[@MODULE[InterstellarFuelSwitch]:HAS[#resourceNames[LiquidFuel,Oxidizer*]]]:NEEDS[LLL,InterstellarFuelSwitch]:BEFORE[CryoTanks]
{
	// Copy the full initialResourceAmounts string into temporary values.
	// Example:
	//   893,1091;1984;1984;99222;2481;0
	%LLL_LF_Amount = #$MODULE[InterstellarFuelSwitch]/initialResourceAmounts$
	%LLL_OX_Amount = #$MODULE[InterstellarFuelSwitch]/initialResourceAmounts$

	// Extract the first LiquidFuel amount.
	// Example:
	//   893,1091;1984;...
	// becomes:
	//   893
	@LLL_LF_Amount ^= :^([^,;]+),([^;]+).*$:$1:

	// Extract the first Oxidizer amount.
	// Example:
	//   893,1091;1984;...
	// becomes:
	//   1091
	@LLL_OX_Amount ^= :^([^,;]+),([^;]+).*$:$2:

	// Remove the IFS module.  CryoTanks will work with the stock resources.
	!MODULE[InterstellarFuelSwitch],* {}

	// Create LiquidFuel resource using the extracted amount.
	RESOURCE
	{
		name = LiquidFuel
		amount = #$../LLL_LF_Amount$
		maxAmount = #$../LLL_LF_Amount$
	}

	// Create Oxidizer resource using the extracted amount.
	RESOURCE
	{
		name = Oxidizer
		amount = #$../LLL_OX_Amount$
		maxAmount = #$../LLL_OX_Amount$
	}
}

// ----------------------------------------------------------------------------
// Cleanup pass
//
// Runs after CryoTanks has completed processing and removes the temporary
// values used to transfer the IFS resource amounts.
// ----------------------------------------------------------------------------

@PART[*]:HAS[#LLL_LF_Amount[],#LLL_OX_Amount[]]:AFTER[CryoTanks]
{
	!LLL_LF_Amount = DELETE
	!LLL_OX_Amount = DELETE
}

